# Rate limiting: general traffic and a stricter bucket for login/register
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# Keep https from a TLS terminator in front of this container; otherwise use our own scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Long caching only for files that exist (200) or were revalidated (304). A 404 for a missing chunk
# (e.g. a request that reached the old container during a deploy) must not stay in the browser cache,
# or that page keeps failing with "Importing a module script failed" until site data is cleared.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}
map $status $ocr_cache_control {
    200     "public, max-age=2592000";
    304     "public, max-age=2592000";
    206     "public, max-age=2592000";
    default "no-store";
}

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml application/wasm;

    # Security headers
    # 'wasm-unsafe-eval' lets the barcode scanner and the OCR compile their WebAssembly (served from /assets and /ocr, not a CDN);
    # it does not allow eval() of JavaScript. Permissions-Policy: camera for this origin only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # index.html (and other unhashed files) must be revalidated, or browsers keep a page that points at code
    # chunks of the previous build. /assets/ (hashed, immutable) and /api/ set their own Cache-Control.
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;

    # Health check (used by the container healthcheck and external monitoring)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Auth endpoints: stricter rate limiting
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy-params.conf;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy-params.conf;
        add_header Cache-Control "no-store" always;
    }

    # PWA manifest (nginx may not know the .webmanifest extension)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # OCR engine (worker, WebAssembly cores, language data): big, versioned with the image, cache for a month
    location /ocr/ {
        try_files $uri =404;
        add_header Cache-Control $ocr_cache_control always;
    }

    # Cache hashed static assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
    }

    # SPA routing - send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

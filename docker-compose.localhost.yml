services:
  postgres:
    image: postgres:16-alpine
    container_name: kmalarder-postgres
    environment:
      POSTGRES_DB: kmalarder
      POSTGRES_USER: kmalarder
      POSTGRES_PASSWORD: kmalarder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmalarder"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
